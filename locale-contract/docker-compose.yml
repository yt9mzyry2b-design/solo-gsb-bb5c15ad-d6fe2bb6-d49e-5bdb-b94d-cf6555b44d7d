services:
  locale-contract:
    build: .
    image: locale-contract:latest
    container_name: locale-contract
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      TZ: Asia/Shanghai
    volumes:
      - lc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lc-data:
