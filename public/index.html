<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocaleContract — ICU 多语言消息目录审查</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⧉</span>
      <h1>LocaleContract</h1>
      <span class="tagline">ICU MessageFormat 多语言一致性审查</span>
    </div>
    <div class="top-actions">
      <select id="projectSelect" title="切换项目"></select>
      <button id="newProjectBtn" class="btn">新建项目</button>
    </div>
  </header>

  <main id="app" class="layout hidden">
    <!-- Left: locales + inputs -->
    <section class="panel input-panel">
      <div class="panel-head">
        <h2>语言目录</h2>
        <div class="head-actions">
          <label class="ref-label">参考语言
            <select id="refLocaleSelect"></select>
          </label>
          <button id="addLocaleBtn" class="btn btn-small">＋ 添加语言</button>
        </div>
      </div>
      <div id="localeList" class="locale-list"></div>
      <div class="analyze-bar">
        <button id="analyzeBtn" class="btn btn-primary">运行一致性校验</button>
        <span id="analyzeHint" class="muted"></span>
      </div>

      <div class="export-bar">
        <button id="exportJsonBtn" class="btn btn-small" disabled>导出 JSON 报告</button>
        <button id="exportCsvBtn" class="btn btn-small" disabled>导出 CSV 报告</button>
        <select id="historySelect" title="历史报告"></select>
      </div>
    </section>

    <!-- Center: findings + keys -->
    <section class="panel findings-panel">
      <div class="panel-head">
        <h2>校验结果</h2>
        <div id="summaryBadges" class="badges"></div>
      </div>
      <div class="filters">
        <input id="filterInput" type="search" placeholder="筛选键路径或问题描述…" />
        <select id="severityFilter">
          <option value="all">全部级别</option>
          <option value="error">错误</option>
          <option value="warning">警告</option>
          <option value="info">提示</option>
          <option value="ok">仅通过</option>
        </select>
        <select id="localeFilter">
          <option value="all">全部语言</option>
        </select>
      </div>

      <div class="split">
        <div class="split-col">
          <h3 class="col-title">问题清单 <span id="findingCount" class="muted"></span></h3>
          <div id="findingList" class="finding-list"></div>
        </div>
        <div class="split-col">
          <h3 class="col-title">消息键 <span id="keyCount" class="muted"></span></h3>
          <div id="keyList" class="key-list"></div>
        </div>
      </div>
    </section>

    <!-- Right: detail + preview -->
    <section class="panel detail-panel">
      <div class="panel-head">
        <h2 id="detailTitle">消息详情</h2>
      </div>
      <div id="detailBody" class="detail-body">
        <p class="empty-hint">选择左侧消息键或问题以查看详情、占位符结构与渲染预览。</p>
      </div>
    </section>
  </main>

  <div id="emptyState" class="empty-state">
    <div class="empty-card">
      <div class="big-logo">⧉</div>
      <h2>LocaleContract</h2>
      <p>粘贴或上传各语言 JSON 目录,校验 ICU MessageFormat 的占位符、plural/select 分支类别与嵌套结构是否一致,并实时预览渲染结果。</p>
      <button id="emptyNewBtn" class="btn btn-primary">创建第一个项目</button>
    </div>
  </div>

  <!-- Locale editor modal -->
  <div id="localeModal" class="modal hidden">
    <div class="modal-card">
      <h3 id="localeModalTitle">添加语言</h3>
      <div class="form-row">
        <label>语言代码 <input id="localeCodeInput" type="text" placeholder="en / zh-CN / ja …" /></label>
        <label>显示名称 <input id="localeLabelInput" type="text" placeholder="英语(可选)" /></label>
      </div>
      <div class="form-row">
        <label class="file-btn btn btn-small">
          上传 JSON 文件
          <input id="localeFileInput" type="file" accept=".json,application/json" hidden />
        </label>
        <span id="fileName" class="muted"></span>
      </div>
      <textarea id="localeContentInput" class="code-input" spellcheck="false"
        placeholder='{"greeting":"Hello, {name}!","items":"{count, plural, one{# item} other{# items}}"}'></textarea>
      <div class="modal-actions">
        <button id="localeCancelBtn" class="btn">取消</button>
        <button id="localeSaveBtn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="projectModal" class="modal hidden">
    <div class="modal-card modal-small">
      <h3>新建项目</h3>
      <label class="form-block">项目名称
        <input id="projectNameInput" type="text" placeholder="例如 Web App 5.2 文案" />
      </label>
      <div class="modal-actions">
        <button id="projectCancelBtn" class="btn">取消</button>
        <button id="projectCreateBtn" class="btn btn-primary">创建</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
